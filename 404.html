<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>העמוד לא נמצא | בריאות בטבע</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1a3d2b" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #1a3d2b;
      color: #fff;
    }
    img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #c9a84c; object-fit: cover; margin-bottom: 24px; }
    h1 { font-family: 'Frank Ruhl Libre', serif; font-size: 2rem; margin-bottom: 10px; }
    p { color: rgba(255,255,255,0.75); margin-bottom: 28px; }
    a {
      display: inline-block;
      background: #c9a84c;
      color: #1a3d2b;
      padding: 13px 30px;
      border-radius: 30px;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #e8c97a; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/heart-leaves.jpg" alt="" width="110" height="110">
    <h1>העמוד לא נמצא</h1>
    <p>ייתכן שהקישור שגוי או שהעמוד הוסר.</p>
    <a href="/">חזרה לדף הבית</a>
  </main>
</body>
</html>
